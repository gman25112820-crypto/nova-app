name: nova_app
description: Nova Pain Management App v4.0
publish_to: "none"
version: 4.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  shared_preferences: ^2.5.4
  fl_chart: ^1.2.0
  pdf: ^3.12.0
  printing: ^5.14.0
  image_picker: ^1.1.2
  file_picker: 3.0.4
  path_provider: ^2.1.4
  share_plus: 12.0.2
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^5.0.2
  timezone: ^0.10.1
  flutter_svg: ^2.2.4
  flutter_body_atlas: ^0.1.4
  web: ^1.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  audioplayers: ^6.0.0
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/characters/
    - assets/audio/
    - assets/videos/
    - assets/graphics/